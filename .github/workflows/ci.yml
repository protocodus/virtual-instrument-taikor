name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP unit and audio tests, Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure DSP build
        run: |
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON

      - name: Build DSP, tests and tools
        run: cmake --build build-dsp --parallel

      - name: Unit tests
        run: ctest --test-dir build-dsp -L unit --no-tests=error --output-on-failure

      # Renders the whole README demo set twice and requires identical bytes.
      - name: Audio tests
        run: ctest --test-dir build-dsp -L audio --no-tests=error --output-on-failure

      - name: Upload rendered demos
        uses: actions/upload-artifact@v4
        with:
          name: ci-audio-demos-${{ github.run_number }}
          path: build-dsp/audio-demos/first
          if-no-files-found: error
          retention-days: 7

      - name: Configure Linux plug-in build
        run: |
          cmake -S . -B build-plugin -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=ON -DBUILD_TESTING=OFF

      - name: Build Linux VST3, CLAP and standalone
        run: |
          cmake --build build-plugin --parallel \
            --target Taikor_VST3 Taikor_CLAP Taikor_Standalone

      - name: Package Linux VST3, CLAP and standalone
        run: python3 scripts/package-linux.py --build-dir build-plugin

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-build-${{ github.run_number }}
          path: build-plugin/dist/Taikor-*-build.${{ github.run_number }}-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in unit and render tests, macOS package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Universal, like the shipped build; render renders the editor screenshot.
      - name: Build universal plug-in and run unit and render tests
        env:
          BUILD_UNIVERSAL: "ON"
          CTEST_LABELS: "unit|render"
        run: ./scripts/build-macos.sh

      - name: Upload rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshot-${{ github.run_number }}
          path: build-macos/screenshots/taikor-standalone.png
          if-no-files-found: error
          retention-days: 7

      - name: Package (ad-hoc-signed bundles)
        run: ./scripts/sign-and-package-macos.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos-build-${{ github.run_number }}
          path: |
            build-macos/dist/Taikor-*-build.${{ github.run_number }}-macOS-universal.zip
            build-macos/dist/Taikor-*-build.${{ github.run_number }}-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 7

  dsp-tests-windows:
    name: Unit tests, Windows package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure DSP tests
        run: |
          cmake -S . -B build-dsp -A x64 -DTAIKOR_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build DSP tests
        run: cmake --build build-dsp --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build-dsp -C Release -L unit --no-tests=error --output-on-failure

      - name: Configure Windows plug-in build
        run: |
          cmake -S . -B build-plugin -A x64 -DTAIKOR_BUILD_PLUGIN=ON -DBUILD_TESTING=OFF

      - name: Build Windows VST3, CLAP and standalone
        run: |
          cmake --build build-plugin --config Release --parallel --target Taikor_VST3 Taikor_CLAP Taikor_Standalone

      - name: Package Windows VST3, CLAP and standalone
        run: python scripts/package-windows.py --build-dir build-plugin

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-build-${{ github.run_number }}
          path: build-plugin/dist/Taikor-*-build.${{ github.run_number }}-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    name: Unit and fuzz tests under ASan + UBSan, C++17 DSP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build

      # The default build includes TaikorDSPCxx17, the Rack-toolchain proof.
      - name: Configure and build instrumented DSP, tests and fuzzer
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTAIKOR_BUILD_PLUGIN=OFF -DTAIKOR_BUILD_TOOLS=OFF -DBUILD_TESTING=ON \
            -DTAIKOR_ENABLE_SANITIZERS=ON -DTAIKOR_BUILD_FUZZER=ON
          cmake --build build-sanitize --parallel

      - name: Unit and fuzz tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        working-directory: build-sanitize
        run: ctest -L 'unit|fuzz' --no-tests=error --output-on-failure --parallel 2

      - name: Preserve fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-fuzz-${{ github.run_number }}
          path: |
            build-sanitize/crash-*
            build-sanitize/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
