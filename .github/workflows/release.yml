name: Release

# A v* tag runs every test tier, validates and packages every format, and
# drafts a GitHub release from the packages. Nothing is published until a
# person reviews the draft. A manual run builds and validates the same packages
# without drafting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check the tag matches the CMake version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare tag and project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(sed -n 's/^project(Taikor VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi

  linux:
    name: Linux unit, audio and fuzz tests, pluginval, package
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build pkg-config xvfb \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Unit and audio tests
        run: |
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp -L 'unit|audio' --no-tests=error --output-on-failure

      - name: Unit and fuzz tests under ASan + UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTAIKOR_BUILD_PLUGIN=OFF -DTAIKOR_BUILD_TOOLS=OFF -DBUILD_TESTING=ON \
            -DTAIKOR_ENABLE_SANITIZERS=ON -DTAIKOR_BUILD_FUZZER=ON
          cmake --build build-sanitize --parallel
          ctest --test-dir build-sanitize -L 'unit|fuzz' --no-tests=error --output-on-failure --parallel 2

      - name: Build plug-in and run its unit tests
        run: |
          cmake -S . -B build-plugin -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=ON -DBUILD_TESTING=ON
          cmake --build build-plugin --parallel
          xvfb-run -a ctest --test-dir build-plugin -L unit --no-tests=error --output-on-failure

      - name: Validate with pluginval
        run: ./scripts/validate-plugins.sh build-plugin

      - name: Package
        run: python3 scripts/package-linux.py --build-dir build-plugin

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: build-plugin/dist/Taikor-*-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows unit tests, pluginval, package
    needs: check-version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build plug-in and run unit tests
        run: |
          cmake -S . -B build-win -A x64 -DTAIKOR_BUILD_PLUGIN=ON -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"
          cmake --build build-win --config Release --parallel
          ctest --test-dir build-win -C Release -L unit --no-tests=error --output-on-failure

      - name: Validate with pluginval
        shell: bash
        run: ./scripts/validate-plugins.sh build-win

      - name: Package
        run: python scripts/package-windows.py --build-dir build-win

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build-win/dist/Taikor-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS unit and render tests, pluginval, auval, signed package
    needs: check-version
    runs-on: macos-15
    outputs:
      signing: ${{ steps.signing.outputs.state || 'ad-hoc signed, pkg unsigned, not notarized' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build universal plug-in and run unit and render tests
        env:
          CTEST_LABELS: "unit|render"
        run: ./scripts/build-macos.sh

      - name: Validate with pluginval and auval
        run: ./scripts/validate-plugins.sh build-macos

      # Without the certificate secret the bundles are signed ad hoc and the
      # pkg is unsigned; the draft release says which happened.
      - name: Import Developer ID identities
        id: signing
        env:
          CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          APP_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATES_P12" ]]; then
            echo "::notice::No MACOS_CERTIFICATES_P12 secret: bundles are signed ad hoc and the pkg is unsigned."
            exit 0
          fi
          if [[ -z "$APP_IDENTITY" || -z "$INSTALLER_IDENTITY" ]]; then
            echo "::error::MACOS_CERTIFICATES_P12 needs MACOS_APP_SIGN_IDENTITY and MACOS_INSTALLER_SIGN_IDENTITY."
            exit 1
          fi
          keychain="$RUNNER_TEMP/taikor-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo -n "$CERTIFICATES_P12" | base64 --decode -o "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -P "$CERTIFICATES_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          {
            echo "APP_SIGN_IDENTITY=$APP_IDENTITY"
            echo "INSTALLER_SIGN_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"
          state="Developer ID signed, not notarized"
          if [[ -n "$NOTARY_PASSWORD" ]]; then
            xcrun notarytool store-credentials taikor-notary --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain"
            echo "NOTARY_PROFILE=taikor-notary" >> "$GITHUB_ENV"
            state="Developer ID signed, pkg notarized and stapled"
          else
            echo "::notice::No MACOS_NOTARY_PASSWORD secret: the macOS package is not notarized."
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Package
        run: ./scripts/sign-and-package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            build-macos/dist/Taikor-*-macOS-universal.zip
            build-macos/dist/Taikor-*-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS and BUILD.txt
        working-directory: release
        env:
          SIGNING: ${{ needs.macos.outputs.signing }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(Taikor-*)
          if (( ${#packages[@]} != 4 )); then
            echo "error: expected four packages, found ${#packages[@]}" >&2
            printf '  %s\n' "${packages[@]:-(none)}" >&2
            exit 1
          fi
          sha256sum "${packages[@]}" > SHA256SUMS
          printf 'Repository: %s\nTag: %s\nCommit: %s\nBuild number: %s\nmacOS signing: %s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$SIGNING" > BUILD.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Taikor ${GITHUB_REF_NAME#v}" \
            --notes "Built from ${GITHUB_SHA}. macOS: ${{ needs.macos.outputs.signing }}. See README.md's Version history for what changed."
