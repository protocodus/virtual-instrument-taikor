name: Main build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

# Build installable packages for every merge/push to main, plus daily and manual runs.
permissions:
  contents: read

# No shared concurrency group: GitHub would otherwise replace pending runs,
# skipping distribution builds when several merges arrive close together.

jobs:
  # Render in an empty staging tree so committed media cannot satisfy the
  # checks. Linux is the canonical renderer; the README copy carries the preset
  # demo table and the technique level table beside the exact audio that will
  # be published.
  render-audio-demos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Render the preset demos and the 27 technique takes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The preset renderer encodes its MP3s with ffmpeg's libmp3lame.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render fresh demo audio
        run: |
          set -euo pipefail
          cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=OFF -DBUILD_TESTING=OFF
          cmake --build build-dsp --parallel --target RenderTaikorPresetDemos
          generated="build-dsp/generated-media"
          mkdir -p "$generated/Docs/audio"
          cp README.md "$generated/README.md"
          ./build-dsp/RenderTaikorPresetDemos Docs/audio/midi "$generated/Docs/audio"
          ./build-dsp/RenderTaikorPresetDemos --more Docs/audio/midi/more "$generated/Docs/audio/more"
          python3 Tools/update_readme_blocks.py demos --readme "$generated/README.md" \
            --manifest "$generated/Docs/audio/demos.json"

      - name: Upload demo audio and README
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-audio-demos
          path: build-dsp/generated-media
          if-no-files-found: error
          retention-days: 30

  build-macos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: macOS universal VST3, AU, CLAP and standalone
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build-time FetchContent code must not inherit the write credential.
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Full arm64 + x86_64 universal build (script default) plus the unit and
      # render tiers; the render tier draws the README screenshot and checks it.
      - name: Build and run unit and render tests
        env:
          CTEST_LABELS: "unit|render"
        run: ./scripts/build-macos.sh

      - name: Validate with pluginval and auval
        run: ./scripts/validate-plugins.sh build-macos

      # Uploaded before packaging so that a packaging failure cannot cost the
      # run the screenshot it has already rendered, and handed to the commit job
      # rather than committed here.
      #
      # It stays gated on the suite passing, and deliberately so. The processor
      # suite counts its failures rather than stopping at the first one, so a run
      # whose editor assertions failed -- buttons that overlap, a control strip
      # that lost its buttons -- still writes the PNG before reporting the
      # failure. Publishing that image is the one outcome worse than leaving
      # yesterday's in place.
      - name: Upload the rendered screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-screenshot
          path: build-macos/screenshots/taikor.png
          if-no-files-found: error
          retention-days: 30

      - name: Package (ad-hoc-signed bundles)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-macos/CMakeCache.txt)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "error: invalid CMake project version: ${version:-missing}" >&2
            exit 1
          fi
          VERSION="$version" ./scripts/sign-and-package-macos.sh

      - name: Check that both distributable packages were produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(
            build-macos/dist/Taikor-*-build.${GITHUB_RUN_NUMBER}-macOS-universal.zip
            build-macos/dist/Taikor-*-build.${GITHUB_RUN_NUMBER}-macOS-universal.pkg
          )
          if (( ${#packages[@]} != 2 )); then
            echo "error: expected one zip and one pkg, found ${#packages[@]}" >&2
            printf '  %s\n' "${packages[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Packaged %s\n' "${packages[@]}"

      # Handed to the aggregate artifact job as one complete cross-platform set.
      - name: Upload the distributable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-build-${{ github.run_number }}-macos
          path: |
            build-macos/dist/Taikor-*-build.${{ github.run_number }}-macOS-universal.zip
            build-macos/dist/Taikor-*-build.${{ github.run_number }}-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 30

  build-linux:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Linux build and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            xvfb

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=ON \
            -DBUILD_TESTING=OFF

      - name: Build VST3, CLAP and standalone
        run: |
          cmake --build build-linux --parallel \
            --target Taikor_VST3 Taikor_CLAP Taikor_Standalone

      - name: Validate with pluginval
        run: ./scripts/validate-plugins.sh build-linux

      - name: Package (Linux x64 tarball)
        run: python3 scripts/package-linux.py --build-dir build-linux

      - name: Upload the distributable Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-build-${{ github.run_number }}-linux
          path: build-linux/dist/Taikor-*-build.${{ github.run_number }}-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Windows x64 VST3, CLAP and standalone
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Configure
        run: |
          cmake -S . -B build-win -A x64 -DTAIKOR_BUILD_PLUGIN=ON -DBUILD_TESTING=OFF

      - name: Build VST3, CLAP and standalone
        run: |
          cmake --build build-win --config Release --parallel --target Taikor_VST3 Taikor_CLAP Taikor_Standalone

      - name: Validate with pluginval
        shell: bash
        run: ./scripts/validate-plugins.sh build-win

      - name: Package (Windows x64 ZIP)
        run: python scripts/package-windows.py --build-dir build-win

      - name: Upload the distributable Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-build-${{ github.run_number }}-win
          path: build-win/dist/Taikor-*-build.${{ github.run_number }}-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # Publish the screenshot, audio and their level table in one commit only
  # after the same source revision has produced the complete distribution.
  commit-generated-assets:
    if: github.ref == 'refs/heads/main'
    name: Refresh committed screenshot and audio demos
    needs: collect-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download rendered audio and level table
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-audio-demos
          path: generated-media

      - name: Download rendered screenshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-screenshot
          path: generated-media/Docs/screenshots

      - name: Commit refreshed media if main still matches this build
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_URL: ${{ needs.collect-packages.outputs.distribution-url }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ./scripts/commit-generated-assets.sh "$GITHUB_SHA" generated-media "$remote" "$DISTRIBUTION_URL"

  # Keep one complete package set on the workflow run. A mutable rolling GitHub
  # release is deliberately not used: repository release immutability protects
  # commercial tags and assets, while development builds remain short-lived.
  collect-packages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Collect plugins, screenshot and audio demos
    needs: [build-macos, build-linux, build-windows, render-audio-demos]
    runs-on: ubuntu-latest
    outputs:
      distribution-url: ${{ steps.distribution.outputs.artifact-url }}
    permissions:
      contents: read
    steps:
      - name: Download every package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: distribution-packages-build-${{ github.run_number }}-*
          merge-multiple: true
          path: dist

      - name: Check the four-file manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Deliberately expand this glob so the array contains every match.
          # shellcheck disable=SC2206
          mac_zips=(dist/Taikor-*-build.${GITHUB_RUN_NUMBER}-macOS-universal.zip)
          if (( ${#mac_zips[@]} != 1 )); then
            echo "error: expected exactly one macOS zip, found ${#mac_zips[@]}" >&2
            printf '  %s\n' "${mac_zips[@]:-(none)}" >&2
            exit 1
          fi
          filename="${mac_zips[0]##*/}"
          version="${filename#Taikor-}"
          version="${version%-build.${GITHUB_RUN_NUMBER}-macOS-universal.zip}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "error: invalid version in $filename" >&2
            exit 1
          fi
          expected=(
            "dist/Taikor-${version}-build.${GITHUB_RUN_NUMBER}-macOS-universal.zip"
            "dist/Taikor-${version}-build.${GITHUB_RUN_NUMBER}-macOS-universal.pkg"
            "dist/Taikor-${version}-build.${GITHUB_RUN_NUMBER}-Linux-x64.tar.gz"
            "dist/Taikor-${version}-build.${GITHUB_RUN_NUMBER}-Windows-x64.zip"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "error: missing, empty, or version-mismatched asset: $asset" >&2
              exit 1
            fi
          done
          assets=(dist/*)
          if (( ${#assets[@]} != 4 )); then
            echo "error: expected exactly four release assets, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Release asset: %s\n' "${assets[@]}"

      - name: Download matching audio demos and level table
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-audio-demos
          path: dist/previews

      - name: Download matching screenshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-screenshot
          path: dist/previews/Docs/screenshots

      - name: Record build provenance and checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: dist
        run: |
          set -euo pipefail
          printf 'Repository: %s\nCommit: %s\nBuild number: %s\nBuild: %s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$GITHUB_RUN_NUMBER" "$RUN_URL" > BUILD.txt
          find Taikor-* previews -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      # Retained on the workflow run itself, downloadable by anyone with repo
      # access, as one complete cross-platform set.
      - name: Upload workflow artifact
        id: distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taikor-main-build-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  # The long run of the harness CI runs briefly on every push. It stands apart
  # from the package jobs, so a finding fails the run without holding back the
  # downloads of an otherwise good build.
  fuzz:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Long DSP fuzz run under ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build

      - name: Build the fuzzer
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTAIKOR_BUILD_PLUGIN=OFF -DTAIKOR_BUILD_TOOLS=OFF -DBUILD_TESTING=OFF \
            -DTAIKOR_BUILD_FUZZER=ON
          cmake --build build-sanitize --parallel --target TaikorDspFuzz

      - name: Fuzz for 30 minutes
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          mkdir -p build-sanitize/corpus build-sanitize/fuzz-artifacts
          build-sanitize/TaikorDspFuzz build-sanitize/corpus \
            -seed=${{ github.run_number }} -max_total_time=1800 -max_len=4096 \
            -timeout=30 -rss_limit_mb=4096 \
            -artifact_prefix=build-sanitize/fuzz-artifacts/

      - name: Preserve corpus and reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taikor-fuzz-${{ github.run_number }}
          path: |
            build-sanitize/corpus
            build-sanitize/fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 30

  # The standard's full U4 matrix: every case at all nine rate and block-size
  # configurations. CI's sanitizer job runs each case at one of them in turn.
  parameter-matrix:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Full parameter-extremes matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The portfolio's tools and checks run on Python 3.12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Build the matrix
        run: |
          cmake -S . -B build-plugin -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=ON -DTAIKOR_BUILD_CLAP=OFF -DTAIKOR_BUILD_TOOLS=OFF -DBUILD_TESTING=ON
          cmake --build build-plugin --parallel --target TaikorParameterMatrixTests

      - name: Run every case at every configuration
        run: xvfb-run -a build-plugin/TaikorParameterMatrixTests --jobs 4
