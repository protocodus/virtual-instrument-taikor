name: Main build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

# Build installable packages for every merge/push to main, plus daily and manual runs.
permissions:
  contents: read

# No shared concurrency group: GitHub would otherwise replace pending runs,
# skipping distribution builds when several merges arrive close together.

env:
  BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
  DIST_ROOT: ${{ github.workspace }}/dist

jobs:
  # Render in an empty staging tree so committed WAVs cannot satisfy the count.
  # Linux is the canonical renderer; the README copy keeps its generated peaks
  # table beside the exact audio that will be published.
  render-audio-demos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Render all 27 audio demos and update their level table
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Render fresh demo audio
        run: |
          set -euo pipefail
          cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=OFF -DBUILD_TESTING=OFF
          cmake --build build-dsp --parallel --target TaikorRenderDemos
          generated="build-dsp/generated-media"
          mkdir -p "$generated/Docs/audio"
          cp README.md "$generated/README.md"
          ./build-dsp/TaikorRenderDemos "$generated/Docs/audio"
          rendered=$(find "$generated/Docs/audio" -maxdepth 1 -name '[0-9][0-9]-*.wav' | wc -l)
          if (( rendered != 27 )); then
            echo "error: rendered $rendered demo WAVs, expected 27" >&2
            exit 1
          fi
          echo "Rendered all $rendered demo WAVs."

      - name: Upload demo audio and generated level table
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-audio-demos
          path: build-dsp/generated-media
          if-no-files-found: error
          retention-days: 30

  build-macos:
    outputs:
      version: ${{ steps.release.outputs.version }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: macOS universal VST3, AU, CLAP and standalone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build-time FetchContent code must not inherit the write credential.
          persist-credentials: false

      # Removing the committed image first is what makes the check after the
      # build meaningful: the file can only be there afterwards because this
      # run's suite rendered it, so a suite that quietly stopped writing its
      # snapshot fails the build instead of republishing a stale editor.
      - name: Clear the committed screenshot before rendering
        run: rm -f Docs/screenshots/taikor-standalone.png

      # Full arm64 + x86_64 universal build (script default) plus the project's
      # tests. The suite renders the committed editor screenshot while it runs,
      # so the image in the README tracks the real editor.
      - name: Build and run tests
        run: |
          set -euo pipefail
          export "TAIKOR_EDITOR_SNAPSHOT=${GITHUB_WORKSPACE}/Docs/screenshots/taikor-standalone.png"
          ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="Docs/screenshots/taikor-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: the suite did not render $screenshot" >&2
            echo "The suite must honour TAIKOR_EDITOR_SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          # The signature alone only proves the write started: a PNG truncated
          # part way through still carries it. Every PNG ends with a zero-length
          # IEND chunk and its constant CRC, so the trailer is what proves the
          # encoder ran to completion and a whole image landed.
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

      # Uploaded before packaging so that a packaging failure cannot cost the
      # run the screenshot it has already rendered, and handed to the commit job
      # rather than committed here.
      #
      # It stays gated on the suite passing, and deliberately so. The processor
      # suite counts its failures rather than stopping at the first one, so a run
      # whose editor assertions failed -- a blank render, buttons that overlap, a
      # control strip that lost its buttons -- still writes the PNG before
      # reporting the failure. Publishing that image is the one outcome worse
      # than leaving yesterday's in place.
      - name: Upload the rendered screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-screenshot
          path: Docs/screenshots/taikor-standalone.png
          if-no-files-found: error
          retention-days: 30

      - name: Package (ad-hoc-signed bundles)
        id: release
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/sign-and-package-macos.sh
          archs="$(lipo -archs build-macos/Taikor_artefacts/Release/VST3/Taikor.vst3/Contents/MacOS/Taikor)"
          arch="x64"
          if [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]; then arch="universal"
          elif [[ "$archs" == *arm64* ]]; then arch="arm64"; fi
          echo "version=$(python scripts/release_metadata.py --build-dir build-macos --field version)" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "dist=$(python scripts/release_metadata.py --build-dir build-macos --platform macOS --arch "$arch" --dist)" >> "$GITHUB_OUTPUT"

      - name: Check that both distributable packages were produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("${{ steps.release.outputs.dist }}"/*.zip "${{ steps.release.outputs.dist }}"/*.pkg)
          test "${#packages[@]}" -eq 2

      - name: Upload the distributable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Taikor-${{ steps.release.outputs.version }}-build.${{ env.BUILD_NUMBER }}-macOS-${{ steps.release.outputs.arch }}
          path: ${{ steps.release.outputs.dist }}/*
          if-no-files-found: error
          retention-days: 30

  build-linux:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Linux build and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTAIKOR_BUILD_PLUGIN=ON \
            -DBUILD_TESTING=OFF

      - name: Build VST3, CLAP and standalone
        run: |
          cmake --build build-linux --parallel \
            --target Taikor_VST3 Taikor_CLAP Taikor_Standalone

      - name: Package (Linux x64 tarball)
        id: release
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=build-linux bash scripts/package-linux.sh
          arch="x64"
          echo "version=$(python scripts/release_metadata.py --build-dir build-linux --field version)" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "dist=$(python scripts/release_metadata.py --build-dir build-linux --platform Linux --arch "$arch" --dist)" >> "$GITHUB_OUTPUT"

      - name: Upload the distributable Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Taikor-${{ steps.release.outputs.version }}-build.${{ env.BUILD_NUMBER }}-Linux-${{ steps.release.outputs.arch }}
          path: ${{ steps.release.outputs.dist }}/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Windows x64 VST3, CLAP and standalone
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure
        run: |
          cmake -S . -B build-win -A x64 -DTAIKOR_BUILD_PLUGIN=ON -DBUILD_TESTING=OFF

      - name: Build VST3, CLAP and standalone
        run: |
          cmake --build build-win --config Release --parallel --target Taikor_VST3 Taikor_CLAP Taikor_Standalone

      - name: Package (Windows x64 ZIP)
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package-windows.py --build-dir build-win
          arch="x64"
          echo "version=$(python scripts/release_metadata.py --build-dir build-win --field version)" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "dist=$(python scripts/release_metadata.py --build-dir build-win --platform Windows --arch "$arch" --dist)" >> "$GITHUB_OUTPUT"

      - name: Upload the distributable Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Taikor-${{ steps.release.outputs.version }}-build.${{ env.BUILD_NUMBER }}-Windows-${{ steps.release.outputs.arch }}
          path: ${{ steps.release.outputs.dist }}/*
          if-no-files-found: error
          retention-days: 30

  # Publish the screenshot, audio and their level table in one commit only
  # after the same source revision has produced the complete distribution.
  commit-generated-assets:
    if: github.ref == 'refs/heads/main'
    name: Refresh committed screenshot and audio demos
    needs: collect-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download rendered audio and level table
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-audio-demos
          path: generated-media

      - name: Download rendered screenshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-screenshot
          path: generated-media/Docs/screenshots

      - name: Commit refreshed media if main still matches this build
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_URL: ${{ needs.collect-packages.outputs.distribution-url }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ./scripts/commit-generated-assets.sh "$GITHUB_SHA" generated-media "$remote" "$DISTRIBUTION_URL"

  # Keep one complete package set on the workflow run. A mutable rolling GitHub
  # release is deliberately not used: repository release immutability protects
  # commercial tags and assets, while development builds remain short-lived.
  collect-packages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Collect plugins, screenshot and audio demos
    needs: [build-macos, build-linux, build-windows, render-audio-demos]
    runs-on: ubuntu-latest
    outputs:
      distribution-url: ${{ steps.distribution.outputs.artifact-url }}
    permissions:
      contents: read
    steps:
      - name: Download every package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Taikor-*-build.${{ env.BUILD_NUMBER }}-*
          merge-multiple: true
          path: dist

      - name: Check the four-file manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Deliberately expand this glob so the array contains every match.
          # shellcheck disable=SC2206
          mac_zips=(dist/Taikor-*-build.${BUILD_NUMBER}-macOS-universal.zip)
          if (( ${#mac_zips[@]} != 1 )); then
            echo "error: expected exactly one macOS zip, found ${#mac_zips[@]}" >&2
            printf '  %s\n' "${mac_zips[@]:-(none)}" >&2
            exit 1
          fi
          filename="${mac_zips[0]##*/}"
          version="${filename#Taikor-}"
          version="${version%-build.${BUILD_NUMBER}-macOS-universal.zip}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "error: invalid version in $filename" >&2
            exit 1
          fi
          expected=(
            "dist/Taikor-${version}-build.${BUILD_NUMBER}-macOS-universal.zip"
            "dist/Taikor-${version}-build.${BUILD_NUMBER}-macOS-universal.pkg"
            "dist/Taikor-${version}-build.${BUILD_NUMBER}-Linux-x64.tar.gz"
            "dist/Taikor-${version}-build.${BUILD_NUMBER}-Windows-x64.zip"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "error: missing, empty, or version-mismatched asset: $asset" >&2
              exit 1
            fi
          done
          assets=(dist/*.zip dist/*.pkg dist/*.tar.gz)
          if (( ${#assets[@]} != 4 )); then
            echo "error: expected exactly four release assets, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Release asset: %s\n' "${assets[@]}"

      - name: Download matching audio demos and level table
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-audio-demos
          path: dist/previews

      - name: Download matching screenshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-screenshot
          path: dist/previews/Docs/screenshots

      - name: Record build provenance and checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: dist
        run: |
          set -euo pipefail
          printf 'Repository: %s\nCommit: %s\nBuild number: %s\nBuild: %s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$BUILD_NUMBER" "$RUN_URL" > BUILD-INFO.txt
          find Taikor-* previews -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      # Retained on the workflow run itself, downloadable by anyone with repo
      # access, as one complete cross-platform set.
      - name: Upload workflow artifact
        id: distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Taikor-${{ needs.build-macos.outputs.version }}-build.${{ env.BUILD_NUMBER }}-All-platforms
          path: dist
          if-no-files-found: error
          retention-days: 30
